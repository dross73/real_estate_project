services:
  db:
    image: postgres:16
    container_name: re_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: realestate
      POSTGRES_USER: admin_db
      POSTGRES_PASSWORD: admin_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Local S3-compatible object storage for listing media development.
  minio:
    image: minio/minio:latest
    container_name: re_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: localdev
      MINIO_ROOT_PASSWORD: localdevsecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # Creates the local media bucket and allows browser reads for development.
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 localdev localdevsecret; do sleep 2; done;
      mc mb --ignore-existing local/real-estate-media;
      mc anonymous set download local/real-estate-media;
      exit 0;
      "

volumes:
  pgdata:
  miniodata:
