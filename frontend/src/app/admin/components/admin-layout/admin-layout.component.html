<a class="admin-skip-link" href="#admin-main-content">Skip to main content</a>

<!-- Main admin layout wrapper -->
<!-- Full screen height container -->
<div class="min-h-screen flex">
  <!-- Mobile overlay: dims background and closes sidebar on click -->
  <div
    class="fixed inset-0 bg-gray-900/20 z-40 md:hidden"
    *ngIf="isSidebarOpen"
    (click)="closeSidebar()"
  ></div>
  <!-- Sidebar -->
  <!-- Fixed width navigation area for admin links -->
  <aside
    class="fixed md:static top-16 left-0 h-full md:h-auto z-50 md:block w-64 bg-gray-900 text-white transform transition-transform duration-300 md:translate-x-0"
    id="admin-navigation"
    aria-label="Admin navigation"
    [class.hidden]="!isSidebarOpen"
    [class.-translate-x-full]="!isSidebarOpen"
    [class.translate-x-0]="isSidebarOpen"
  >
    <!-- Sidebar header (title + mobile close button) -->
    <div class="p-4 pb-5 flex items-center justify-between w-full">
      <!-- Title -->
      <span class="text-lg font-semibold">{{ pageTitle }}</span>
      <!-- Close button (mobile only) -->
      <button
        class="md:hidden"
        type="button"
        aria-label="Close navigation menu"
        (click)="closeSidebar()"
      >
        <mat-icon class="text-gray-300!">close</mat-icon>
      </button>
    </div>

    <nav class="p-4" aria-label="Admin sections">
      <ul class="space-y-2">
        <li>
          <!-- Ensures link is only active on exact route match -->
          <a
            routerLink="/admin/dashboard"
            routerLinkActive="bg-gray-700 text-white border-l-4 border-blue-400"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="closeSidebar()"
            class="block px-4 py-2 rounded hover:bg-gray-800"
          >
            Dashboard
          </a>
        </li>

        <li *ngIf="isAdmin">
          <a
            routerLink="/admin/users"
            routerLinkActive="bg-gray-700 text-white border-l-4 border-blue-400"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="closeSidebar()"
            class="block px-4 py-2 rounded hover:bg-gray-800"
          >
            Users
          </a>
        </li>

        <li *ngIf="isAdmin">
          <a
            routerLink="/admin/agents"
            routerLinkActive="bg-gray-700 text-white border-l-4 border-blue-400"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="closeSidebar()"
            class="block px-4 py-2 rounded hover:bg-gray-800"
          >
            Agents
          </a>
        </li>

        <li *ngIf="isAdmin">
          <a
            routerLink="/admin/offices"
            routerLinkActive="bg-gray-700 text-white border-l-4 border-blue-400"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="closeSidebar()"
            class="block px-4 py-2 rounded hover:bg-gray-800"
          >
            Offices
          </a>
        </li>

        <li *ngIf="isAdmin">
          <a
            routerLink="/admin/settings/site"
            routerLinkActive="bg-gray-700 text-white border-l-4 border-blue-400"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="closeSidebar()"
            class="block px-4 py-2 rounded hover:bg-gray-800"
          >
            Site Settings
          </a>
        </li>

        <li>
          <a
            routerLink="/admin/security"
            routerLinkActive="bg-gray-700 text-white border-l-4 border-blue-400"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="closeSidebar()"
            class="block px-4 py-2 rounded hover:bg-gray-800"
          >
            Security
          </a>
        </li>

        <li>
          <a
            routerLink="/admin/analytics"
            routerLinkActive="bg-gray-700 text-white border-l-4 border-blue-400"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="closeSidebar()"
            class="block px-4 py-2 rounded hover:bg-gray-800"
          >
            Analytics
          </a>
        </li>

        <li>
          <a
            routerLink="/admin/leads"
            routerLinkActive="bg-gray-700 text-white border-l-4 border-blue-400"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="closeSidebar()"
            class="block px-4 py-2 rounded hover:bg-gray-800"
          >
            Leads
          </a>
        </li>

        <li>
          <a
            routerLink="/admin/testimonials"
            routerLinkActive="bg-gray-700 text-white border-l-4 border-blue-400"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="closeSidebar()"
            class="block px-4 py-2 rounded hover:bg-gray-800"
          >
            Testimonials
          </a>
        </li>

        <li>
          <a
            routerLink="/admin/listings"
            routerLinkActive="bg-gray-700 text-white border-l-4 border-blue-400"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="closeSidebar()"
            class="block px-4 py-2 rounded hover:bg-gray-800"
          >
            Listings
          </a>
        </li>
      </ul>
    </nav>
  </aside>

  <!-- Main content area -->
  <!-- Contains header and routed page content -->

  <div class="flex-1 flex flex-col">
    <!-- Top header bar -->
    <header
      class="bg-gray-100 border-b p-4 flex items-center justify-between relative z-50"
    >
      <button
        class="md:hidden text-gray-800"
        type="button"
        aria-label="Open navigation menu"
        aria-controls="admin-navigation"
        [attr.aria-expanded]="isSidebarOpen"
        (click)="toggleSidebar()"
      >
        <mat-icon>menu</mat-icon>
      </button>

      <!-- Page title -->
      <h1 class="font-semibold text-gray-800">Admin Panel</h1>

      <!-- Right side (user info / actions) -->
      <div class="flex items-center space-x-4">
        <span class="text-sm text-gray-700">{{ userRole | titlecase }}</span>

        <button
          type="button"
          (click)="onLogout()"
          class="inline-flex items-center justify-center rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-700 cursor-pointer"
        >
          Log Out
        </button>
      </div>
    </header>

    <!-- Routed content -->
    <main id="admin-main-content" class="p-6 flex-1 bg-gray-50" tabindex="-1">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
