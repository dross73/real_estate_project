<div class="space-y-6">
  <section class="rounded-xl border border-gray-200 bg-white p-6 shadow-sm">
    <h2 class="text-xl font-semibold text-gray-900">
      {{ agentId ? 'Edit Agent' : 'Create Agent' }}
    </h2>
    <p class="mt-2 text-sm text-gray-600">
      Manage profile content, public visibility, and listing assignment availability.
    </p>
  </section>

  <div *ngIf="errorMessage" class="rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">
    {{ errorMessage }}
  </div>

  <section *ngIf="!isLoading" class="rounded-xl border border-gray-200 bg-white p-6 shadow-sm">
    <form class="space-y-6" [formGroup]="form" (ngSubmit)="submit()">
      <div class="grid gap-4 md:grid-cols-2">
        <label class="block text-sm font-medium text-gray-700">
          Full Name
          <input formControlName="full_name" class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2" />
        </label>

        <label class="block text-sm font-medium text-gray-700">
          Professional Title
          <input formControlName="professional_title" class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2" />
        </label>

        <label class="block text-sm font-medium text-gray-700">
          Email
          <input type="email" formControlName="email" class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2" />
        </label>

        <label class="block text-sm font-medium text-gray-700">
          Phone
          <input type="tel" formControlName="phone" class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2" />
        </label>

        <label class="block text-sm font-medium text-gray-700 md:col-span-2">
          Photo URL
          <input type="url" formControlName="photo_url" class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2" />
        </label>

        <label class="block text-sm font-medium text-gray-700 md:col-span-2">
          Office
          <select
            formControlName="office_id"
            class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2"
          >
            <option [ngValue]="null">No office</option>
            <option
              *ngFor="let office of offices"
              [ngValue]="office.id"
              [disabled]="!office.is_active"
            >
              {{ office.name }}{{ office.is_active ? "" : " (inactive)" }}
            </option>
          </select>
          <span class="mt-1 block text-xs text-gray-500">
            Optional. When there is one active office, new profiles default to it
            without requiring an extra choice.
          </span>
        </label>

        <label class="block text-sm font-medium text-gray-700 md:col-span-2">
          Bio
          <textarea rows="7" formControlName="bio" class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2"></textarea>
        </label>
      </div>

      <div class="grid gap-3 md:grid-cols-2">
        <label class="flex items-start gap-3 rounded-lg border border-gray-200 p-3">
          <input type="checkbox" formControlName="is_active" class="mt-1 h-4 w-4" />
          <span>
            <strong class="block text-sm text-gray-800">Active for assignment</strong>
            <span class="text-xs text-gray-500">Inactive agents cannot be newly assigned to listings.</span>
          </span>
        </label>

        <label class="flex items-start gap-3 rounded-lg border border-gray-200 p-3">
          <input type="checkbox" formControlName="is_public" class="mt-1 h-4 w-4" />
          <span>
            <strong class="block text-sm text-gray-800">Show publicly</strong>
            <span class="text-xs text-gray-500">Controls whether this agent appears on public listing pages.</span>
          </span>
        </label>
      </div>

      <div class="flex justify-end gap-3 border-t border-gray-200 pt-6">
        <button type="button" (click)="cancel()" class="rounded-lg border border-gray-300 px-4 py-2 text-sm">Cancel</button>
        <button type="submit" [disabled]="isSubmitting" class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium text-white">
          {{ isSubmitting ? 'Saving...' : 'Save Agent' }}
        </button>
      </div>
    </form>
  </section>
</div>
