<!-- Admin login page -->
<main
  class="flex min-h-screen items-center justify-center bg-gray-100 px-4 py-12"
>
  <!-- Login card -->
  <section
    class="w-full max-w-md rounded-xl border border-gray-200 bg-white p-8 shadow-sm"
    aria-labelledby="login-heading"
  >
    <!-- Login page heading -->
    <div class="text-center">
      <h1 id="login-heading" class="text-2xl font-semibold text-gray-900">
        Admin Login
      </h1>

      <p class="mt-2 text-sm text-gray-600">
        Sign in to manage users and property listings.
      </p>
    </div>

    <!-- Login form -->
    <form
      class="mt-8 space-y-6"
      [formGroup]="loginForm"
      (ngSubmit)="onSubmit()"
    >
      <!-- Email field -->
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700">
          Email
        </label>

        <input
          id="email"
          type="email"
          formControlName="email"
          autocomplete="username"
          [attr.aria-invalid]="
            loginForm.controls.email.touched && loginForm.controls.email.invalid
          "
          aria-describedby="email-error"
          class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2 text-gray-900 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200"
        />

        <!-- Email validation message -->
        <p
          *ngIf="
            loginForm.controls.email.touched && loginForm.controls.email.invalid
          "
          id="email-error"
          class="mt-1 text-sm text-red-600"
        >
          Enter a valid email address.
        </p>
      </div>

      <!-- Password field -->
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700">
          Password
        </label>

        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          [attr.aria-invalid]="
            loginForm.controls.password.touched &&
            loginForm.controls.password.invalid
          "
          aria-describedby="password-error"
          class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2 text-gray-900 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200"
        />

        <!-- Password validation message -->
        <p
          *ngIf="
            loginForm.controls.password.touched &&
            loginForm.controls.password.invalid
          "
          id="password-error"
          class="mt-1 text-sm text-red-600"
        >
          Password is required.
        </p>
      </div>

      <!-- Authentication error message -->
      <div
        *ngIf="errorMessage()"
        role="alert"
        class="rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700"
      >
        {{ errorMessage() }}
      </div>

      <!-- Submit login form -->
      <button
        type="submit"
        [disabled]="isSubmitting()"
        [attr.aria-busy]="isSubmitting()"
        class="w-full rounded-lg bg-blue-600 px-4 py-2 font-medium text-white hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-300 focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-60"
      >
        {{ isSubmitting() ? "Signing in..." : "Sign In" }}
      </button>
    </form>
  </section>
</main>
