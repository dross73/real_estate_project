<div class="space-y-6">
  <section class="rounded-xl border border-gray-200 bg-white p-6 shadow-sm">
    <h2 class="text-xl font-semibold text-gray-900">
      {{ officeId ? 'Edit Office' : 'Create Office' }}
    </h2>
    <p class="mt-2 text-sm text-gray-600">
      Manage office contact information, assignment availability, and public visibility.
    </p>
  </section>

  <div *ngIf="errorMessage" class="rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">
    {{ errorMessage }}
  </div>

  <section *ngIf="!isLoading" class="rounded-xl border border-gray-200 bg-white p-6 shadow-sm">
    <form class="space-y-6" [formGroup]="form" (ngSubmit)="submit()">
      <div class="grid gap-4 md:grid-cols-2">
        <label class="block text-sm font-medium text-gray-700 md:col-span-2">
          Office Name
          <input formControlName="name" class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2" />
        </label>

        <label class="block text-sm font-medium text-gray-700 md:col-span-2">
          Street Address
          <input formControlName="address_line1" class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2" />
        </label>

        <label class="block text-sm font-medium text-gray-700">
          City
          <input formControlName="city" class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2" />
        </label>

        <div class="grid grid-cols-2 gap-3">
          <label class="block text-sm font-medium text-gray-700">
            State
            <input maxlength="2" formControlName="state" class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2 uppercase" />
          </label>
          <label class="block text-sm font-medium text-gray-700">
            Postal Code
            <input formControlName="postal_code" class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2" />
          </label>
        </div>

        <label class="block text-sm font-medium text-gray-700">
          Phone
          <input type="tel" formControlName="phone" class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2" />
        </label>

        <label class="block text-sm font-medium text-gray-700">
          Email
          <input type="email" formControlName="email" class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2" />
        </label>

        <label class="block text-sm font-medium text-gray-700 md:col-span-2">
          Optional Hours
          <textarea rows="4" formControlName="hours" class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2"></textarea>
        </label>
      </div>

      <div class="grid gap-3 md:grid-cols-2">
        <label class="flex items-start gap-3 rounded-lg border border-gray-200 p-3">
          <input type="checkbox" formControlName="is_active" class="mt-1 h-4 w-4" />
          <span>
            <strong class="block text-sm text-gray-800">Active for assignment</strong>
            <span class="text-xs text-gray-500">Inactive offices cannot be newly assigned.</span>
          </span>
        </label>

        <label class="flex items-start gap-3 rounded-lg border border-gray-200 p-3">
          <input type="checkbox" formControlName="is_public" class="mt-1 h-4 w-4" />
          <span>
            <strong class="block text-sm text-gray-800">Show publicly</strong>
            <span class="text-xs text-gray-500">Allows office information on public profiles and listings.</span>
          </span>
        </label>
      </div>

      <div class="flex justify-end gap-3 border-t border-gray-200 pt-6">
        <button type="button" (click)="cancel()" class="rounded-lg border border-gray-300 px-4 py-2 text-sm">Cancel</button>
        <button type="submit" [disabled]="isSubmitting" class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium text-white">
          {{ isSubmitting ? 'Saving...' : 'Save Office' }}
        </button>
      </div>
    </form>
  </section>
</div>
