<div class="space-y-6">
  <section class="rounded-xl border border-gray-200 bg-white p-6 shadow-sm">
    <h2 class="text-xl font-semibold text-gray-900">
      {{ testimonialId ? 'Edit Testimonial' : 'Add Testimonial' }}
    </h2>
    <p class="mt-2 text-sm text-gray-600">
      Manual testimonials can be approved immediately or held for review.
    </p>
  </section>

  <div
    *ngIf="errorMessage"
    role="alert"
    class="rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700"
  >
    {{ errorMessage }}
  </div>

  <section *ngIf="!isLoading" class="rounded-xl border border-gray-200 bg-white p-6 shadow-sm">
    <form class="space-y-5" [formGroup]="form" (ngSubmit)="save()">
      <label class="grid gap-1 text-sm font-medium text-gray-700">
        Customer Name
        <input
          type="text"
          formControlName="authorName"
          class="rounded-lg border border-gray-300 px-3 py-2"
        />
      </label>

      <label class="grid gap-1 text-sm font-medium text-gray-700">
        Testimonial
        <textarea
          rows="8"
          maxlength="3000"
          formControlName="body"
          class="rounded-lg border border-gray-300 px-3 py-2"
        ></textarea>
      </label>

      <div class="grid gap-4 sm:grid-cols-2">
        <label class="grid gap-1 text-sm font-medium text-gray-700">
          Rating <span class="font-normal text-gray-500">(optional)</span>
          <select
            formControlName="rating"
            class="rounded-lg border border-gray-300 px-3 py-2"
          >
            <option [ngValue]="null">No rating</option>
            <option *ngFor="let rating of [5, 4, 3, 2, 1]" [ngValue]="rating">
              {{ rating }}/5
            </option>
          </select>
        </label>

        <label class="grid gap-1 text-sm font-medium text-gray-700">
          Status
          <select
            formControlName="status"
            class="rounded-lg border border-gray-300 px-3 py-2"
          >
            <option *ngFor="let status of statuses" [ngValue]="status">
              {{ status }}
            </option>
          </select>
        </label>
      </div>

      <div class="flex justify-end gap-3 border-t border-gray-200 pt-5">
        <button
          type="button"
          (click)="cancel()"
          class="rounded-lg border border-gray-300 px-4 py-2 text-sm"
        >
          Cancel
        </button>
        <button
          type="submit"
          [disabled]="isSaving"
          class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium text-white disabled:opacity-60"
        >
          {{ isSaving ? 'Saving...' : 'Save Testimonial' }}
        </button>
      </div>
    </form>
  </section>
</div>
