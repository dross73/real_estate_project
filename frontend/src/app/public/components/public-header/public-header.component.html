<a class="skip-link" href="#public-main-content">Skip to main content</a>

<header class="site-header">
  <div class="site-header__inner">
    <!-- Public brand -->
    <a
      class="brand"
      routerLink="/"
      aria-label="Juniper and Lane Realty home"
      (click)="closeMenu()"
    >
      <span class="brand__name">{{ brand.name }}</span>
      <span class="brand__descriptor">{{ brand.descriptor }}</span>
    </a>

    <!-- Desktop navigation -->
    <nav class="desktop-nav" aria-label="Primary navigation">
      <a
        routerLink="/"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        Home
      </a>
      <a routerLink="/listings" routerLinkActive="is-active">Listings</a>
      <a routerLink="/about" routerLinkActive="is-active">About</a>
      <a routerLink="/contact" routerLinkActive="is-active">Contact</a>
    </nav>

    <!-- Account actions remain available on desktop. -->
    <div class="desktop-actions">
      <a routerLink="/account/saved">Saved Homes</a>
      <a class="sign-in-link" routerLink="/account/login">Sign In</a>
    </div>

    <!-- Mobile navigation toggle -->
    <button
      class="menu-button"
      type="button"
      aria-controls="mobile-navigation"
      [attr.aria-expanded]="isMenuOpen"
      (click)="toggleMenu()"
    >
      <span class="menu-button__label">Menu</span>
      <span aria-hidden="true">{{ isMenuOpen ? '×' : '☰' }}</span>
    </button>
  </div>

  @if (isMenuOpen) {
    <nav id="mobile-navigation" class="mobile-nav" aria-label="Mobile navigation">
      <a routerLink="/" (click)="closeMenu()">Home</a>
      <a routerLink="/listings" (click)="closeMenu()">Listings</a>
      <a routerLink="/about" (click)="closeMenu()">About</a>
      <a routerLink="/contact" (click)="closeMenu()">Contact</a>
      <a routerLink="/account/saved" (click)="closeMenu()">Saved Homes</a>
      <a class="mobile-sign-in" routerLink="/account/login" (click)="closeMenu()">
        Sign In
      </a>
    </nav>
  }
</header>
