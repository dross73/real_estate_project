<main class="account-page">
  <header class="account-page__intro">
    <p class="eyebrow">Account recovery</p>
    <h1>Reset Your Password</h1>
    <p>
      Enter the email connected to your customer account. We’ll send a secure,
      single-use reset link when the account is eligible.
    </p>
  </header>

  <section class="account-card" aria-labelledby="reset-request-title">
    <h2 id="reset-request-title">Send reset link</h2>

    @if (successMessage) {
      <p class="account-message account-message--success" role="status">
        {{ successMessage }}
      </p>
    }

    @if (errorMessage) {
      <p class="account-message account-message--error" role="alert">
        {{ errorMessage }}
      </p>
    }

    <form
      class="account-form"
      [formGroup]="resetRequestForm"
      (ngSubmit)="onSubmit()"
    >
      <label class="account-field">
        <span>Email</span>
        <input
          type="email"
          autocomplete="email"
          formControlName="email"
        />
        @if (
          resetRequestForm.controls.email.touched &&
          resetRequestForm.controls.email.invalid
        ) {
          <p class="account-field__error">Enter a valid email address.</p>
        }
      </label>

      <div class="account-actions">
        <button
          class="button button--primary"
          type="submit"
          [disabled]="isSubmitting"
        >
          {{ isSubmitting ? 'Sending…' : 'Send Reset Link' }}
        </button>
        <a class="account-link" routerLink="/account/login">Back to Sign In</a>
      </div>
    </form>
  </section>
</main>
