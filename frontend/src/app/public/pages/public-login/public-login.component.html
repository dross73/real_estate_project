<div class="account-page">
  <header class="account-page__intro">
    <p class="eyebrow">Welcome back</p>
    <h1>Sign In</h1>
    <p>Access your saved homes, saved searches, and account settings.</p>
  </header>

  <section class="account-card" aria-labelledby="sign-in-title">
    <h2 id="sign-in-title">Customer account</h2>

    @if (errorMessage) {
      <p class="account-message account-message--error" role="alert">
        {{ errorMessage }}
      </p>
    }

    <form class="account-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <label class="account-field">
        <span>Email</span>
        <input
          type="email"
          autocomplete="email"
          formControlName="email"
        />
        @if (loginForm.controls.email.touched && loginForm.controls.email.invalid) {
          <p class="account-field__error">Enter a valid email address.</p>
        }
      </label>

      <label class="account-field">
        <span>Password</span>
        <input
          type="password"
          autocomplete="current-password"
          formControlName="password"
        />
        @if (loginForm.controls.password.touched && loginForm.controls.password.invalid) {
          <p class="account-field__error">Enter your password.</p>
        }
      </label>

      <div class="account-actions">
        <button
          class="button button--primary"
          type="submit"
          [disabled]="isSubmitting"
        >
          {{ isSubmitting ? 'Signing In…' : 'Sign In' }}
        </button>
        <a class="account-link" routerLink="/account/forgot-password">
          Forgot password?
        </a>
      </div>
    </form>
  </section>
</div>
