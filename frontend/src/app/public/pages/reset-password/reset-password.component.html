<div class="account-page">
  <header class="account-page__intro">
    <p class="eyebrow">Account recovery</p>
    <h1>Choose a New Password</h1>
    <p>Reset links are single-use and expire for your security.</p>
  </header>

  <section class="account-card" aria-labelledby="new-password-title">
    <h2 id="new-password-title">New password</h2>

    @if (resetComplete) {
      <p class="account-message account-message--success" role="status">
        Your password has been reset. You can sign in with the new password.
      </p>
      <div class="account-actions">
        <a class="button button--primary" routerLink="/account/login">Sign In</a>
      </div>
    } @else {
      @if (errorMessage) {
        <p class="account-message account-message--error" role="alert">
          {{ errorMessage }}
        </p>
      }

      <form class="account-form" [formGroup]="resetForm" (ngSubmit)="onSubmit()">
        <label class="account-field">
          <span>New password</span>
          <input
            id="new-password"
            type="password"
            autocomplete="new-password"
            formControlName="newPassword"
            [attr.aria-invalid]="resetForm.controls.newPassword.touched && resetForm.controls.newPassword.invalid"
            aria-describedby="new-password-hint new-password-error"
          />
          <p id="new-password-hint" class="account-field__hint">Use at least 8 characters.</p>
          @if (resetForm.controls.newPassword.touched && resetForm.controls.newPassword.invalid) {
            <p id="new-password-error" class="account-field__error" role="alert">
              Enter a password with at least 8 characters.
            </p>
          }
        </label>

        <label class="account-field">
          <span>Confirm new password</span>
          <input
            id="confirm-new-password"
            type="password"
            autocomplete="new-password"
            formControlName="confirmPassword"
            [attr.aria-invalid]="resetForm.controls.confirmPassword.touched && resetForm.controls.confirmPassword.invalid"
            [attr.aria-describedby]="resetForm.controls.confirmPassword.touched && resetForm.controls.confirmPassword.invalid ? 'confirm-new-password-error' : null"
          />
          @if (resetForm.controls.confirmPassword.touched && resetForm.controls.confirmPassword.invalid) {
            <p id="confirm-new-password-error" class="account-field__error" role="alert">
              Confirm your new password.
            </p>
          }
        </label>

        <div class="account-actions">
          <button
            class="button button--primary"
            type="submit"
            [disabled]="isSubmitting || !token"
          >
            {{ isSubmitting ? 'Resetting…' : 'Reset Password' }}
          </button>
          <a class="account-link" routerLink="/account/forgot-password">
            Request a new link
          </a>
        </div>
      </form>
    }
  </section>
</div>
