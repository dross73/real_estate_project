services:
  - type: web
    name: juniper-lane-api
    runtime: docker
    plan: 0.5c-512mb
    region: ohio
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    preDeployCommand: python -m alembic upgrade head
    autoDeployTrigger: checksPass
    domains:
      - api.realestate.dan-ross.dev
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: juniper-lane-db
          property: connectionString
      - key: ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ISSUER
        value: juniper-lane-api
      - key: JWT_AUDIENCE
        value: juniper-lane-frontend
      - key: CORS_ORIGINS
        value: https://realestate.dan-ross.dev
      - key: PUBLIC_APP_URL
        value: https://realestate.dan-ross.dev
      - key: EMAIL_DELIVERY_MODE
        value: smtp
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      - key: SMTP_TIMEOUT_SECONDS
        value: "10"
      - key: OBJECT_STORAGE_BUCKET
        sync: false
      - key: OBJECT_STORAGE_REGION
        value: auto
      - key: OBJECT_STORAGE_ENDPOINT_URL
        sync: false
      - key: OBJECT_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: OBJECT_STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: OBJECT_STORAGE_ADDRESSING_STYLE
        value: auto
      - key: OBJECT_STORAGE_PRESIGNED_URL_EXPIRE_SECONDS
        value: "900"

  - type: web
    name: juniper-lane-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build:render
    staticPublishPath: ./dist/real-estate-frontend/browser
    autoDeployTrigger: checksPass
    domains:
      - realestate.dan-ross.dev
    envVars:
      - key: PUBLIC_API_BASE_URL
        value: https://api.realestate.dan-ross.dev
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()

databases:
  - name: juniper-lane-db
    plan: 0.1c-256mb
    region: ohio
    postgresMajorVersion: "16"
    databaseName: realestate
    user: realestate_app
    ipAllowList: []
